name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Create config.js from the CONFIG_JS secret
        env:
          CONFIG_JS: ${{ secrets.CONFIG_JS }}
        run: |
          if [ -z "$CONFIG_JS" ]; then
            echo "::error::Add the CONFIG_JS repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s\n' "$CONFIG_JS" > config.js

      - name: Collect the site files
        run: |
          mkdir _site
          cp *.html *.css *.js _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
